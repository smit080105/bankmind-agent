<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monthly Growth</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand-pill" aria-hidden="true"></div>

        <nav class="sidebar__nav" aria-label="Primary">
          <button class="nav-item is-active" type="button" aria-label="Dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="4" rx="1.5" />
              <rect x="14" y="11" width="7" height="10" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
            </svg>
          </button>
          <button class="nav-item" type="button" aria-label="Orders">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 5.5h12l-1 13H7l-1-13Zm3 0V4.8A3 3 0 0 1 12 2a3 3 0 0 1 3 2.8V5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="nav-item" type="button" aria-label="Analytics">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 18V9.5M10 18V5.5M16 18v-8M22 18V3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <button class="nav-item" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.7v2.1M12 18.2v2.1M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M3.7 12h2.1M18.2 12h2.1M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8" />
            </svg>
          </button>
          <button class="nav-item" type="button" aria-label="Profile">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M5.5 18.5c1.5-2.7 4-4 6.5-4s5 1.3 6.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <button class="nav-item" type="button" aria-label="Logout">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17l5-5-5-5M15 12H4M18 4h1.5A1.5 1.5 0 0 1 21 5.5v13A1.5 1.5 0 0 1 19.5 20H18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </nav>
      </aside>

      <main class="dashboard" aria-label="Monthly growth dashboard">
        <section class="glass-panel">
          <header class="headline">
            <h1>Monthly Growth</h1>
            <div class="growth-copy">
              <span class="growth-copy__value">24%</span>
              <span class="growth-copy__label">Increase</span>
            </div>
          </header>

          <div class="metrics-grid">
            <article class="metric-card metric-card--large" aria-label="Revenue card">
              <div class="metric-card__top">
                <h2>Revenue</h2>
                <div class="metric-card__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M4 14l6-6 4 4 7-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M17 3h3v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
              </div>

              <div class="metric-card__value">$45,200</div>

              <svg class="sparkline sparkline--revenue" viewBox="0 0 300 110" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <linearGradient id="revenueFill" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.85)" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0.15)" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <path d="M0,90 C20,90 35,65 55,70 S85,45 105,48 S145,58 168,42 S208,22 235,38 S270,32 300,20 L300,110 L0,110 Z" fill="url(#revenueFill)" opacity="0.7"/>
                <path d="M0,90 C20,90 35,65 55,70 S85,45 105,48 S145,58 168,42 S208,22 235,38 S270,32 300,20" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </article>

            <article class="metric-card metric-card--medium" aria-label="New users card">
              <div class="metric-card__top">
                <h2>New Users</h2>
                <div class="metric-card__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M5 18V7m7 11V4m7 14v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  </svg>
                </div>
              </div>

              <div class="metric-card__value">1,250</div>

              <div class="bars" aria-hidden="true">
                <span style="--h: 36%"></span>
                <span style="--h: 63%"></span>
                <span style="--h: 55%"></span>
                <span style="--h: 47%"></span>
                <span style="--h: 80%"></span>
                <span style="--h: 72%"></span>
                <span style="--h: 58%"></span>
                <span style="--h: 90%"></span>
                <span style="--h: 40%"></span>
                <span style="--h: 68%"></span>
              </div>
            </article>

            <article class="metric-card metric-card--medium" aria-label="Active sessions card">
              <div class="metric-card__top">
                <h2>Active Sessions</h2>
                <div class="metric-card__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M4 15.5a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M12 12.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8" />
                  </svg>
                </div>
              </div>

              <div class="metric-card__value">3,100</div>

              <div class="donut-wrap" aria-hidden="true">
                <div class="donut"></div>
              </div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
